<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img">
<title>The journey</title>
<style><![CDATA[
  .display { font-family: "Segoe UI Black", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
  .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
  .body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
]]></style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="rgb(140,170,220)" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
</defs>
<rect width="840" height="560" fill="#10161D"/>
<rect width="840" height="560" fill="url(#grid)"/>
<rect x="24.0" y="0.0" width="792.0" height="154.0" rx="6" fill="#18212B" stroke="#2A3644" stroke-width="1"/>
<text x="44.0" y="28.0" class="mono" font-size="11" fill="#93A1B1" text-anchor="start" letter-spacing="2">CHAPTER 2 · FROM FEB 2026</text>
<text x="44.0" y="58.0" class="display" font-size="19" fill="#E4EAF1" text-anchor="start">Building with AI agents</text>
<text x="44.0" y="86.0" class="body" font-size="15" fill="#B8C4D1" text-anchor="start">When AI agents and CLI tools arrived, I learned how to orchestrate them: planning the work,</text>
<text x="44.0" y="110.0" class="body" font-size="15" fill="#B8C4D1" text-anchor="start">splitting it across agents, reviewing what they built and shipping it. I even built my own workspace</text>
<text x="44.0" y="134.0" class="body" font-size="15" fill="#B8C4D1" text-anchor="start">app for it, GridSpace, where I've journaled every session since day one.</text>
<rect x="24.0" y="170.0" width="792.0" height="130.0" rx="6" fill="#18212B" stroke="#2A3644" stroke-width="1"/>
<text x="44.0" y="198.0" class="mono" font-size="11" fill="#7FA2FF" text-anchor="start" letter-spacing="2">CHAPTER 3 · OCT 2026 →</text>
<text x="44.0" y="228.0" class="display" font-size="19" fill="#E4EAF1" text-anchor="start">Back to the fundamentals</text>
<text x="44.0" y="256.0" class="body" font-size="15" fill="#B8C4D1" text-anchor="start">Building with agents is one skill. Writing code yourself is another. So I'm back to writing code by</text>
<text x="44.0" y="280.0" class="body" font-size="15" fill="#B8C4D1" text-anchor="start">hand, and every project is reviewed and scored. My 2024 work counts as my Python baseline.</text>
<rect x="24.0" y="318.0" width="792.0" height="212.0" rx="6" fill="#18212B" stroke="#2A3644" stroke-width="1"/>
<text x="44.0" y="352.0" class="display" font-size="16" fill="#E4EAF1" text-anchor="start">How every project is tracked</text>
<text x="44.0" y="388.0" class="mono" font-size="13" fill="#7FA2FF" text-anchor="start">01</text>
<text x="84" y="388" class="body" font-size="15" fill="#E4EAF1"><tspan font-weight="700">Write it</tspan><tspan fill="#B8C4D1"> · by hand, no generated code</tspan></text>
<text x="44.0" y="418.0" class="mono" font-size="13" fill="#7FA2FF" text-anchor="start">02</text>
<text x="84" y="418" class="body" font-size="15" fill="#E4EAF1"><tspan font-weight="700">Submit it</tspan><tspan fill="#B8C4D1"> · for review</tspan></text>
<text x="44.0" y="448.0" class="mono" font-size="13" fill="#7FA2FF" text-anchor="start">03</text>
<text x="84" y="448" class="body" font-size="15" fill="#E4EAF1"><tspan font-weight="700">Get scored</tspan><tspan fill="#B8C4D1"> · on fundamentals, size and quality</tspan></text>
<text x="44.0" y="478.0" class="mono" font-size="13" fill="#7FA2FF" text-anchor="start">04</text>
<text x="84" y="478" class="body" font-size="15" fill="#E4EAF1"><tspan font-weight="700">Push it</tspan><tspan fill="#B8C4D1"> · the project lands on GitHub</tspan></text>
<text x="44.0" y="508.0" class="mono" font-size="13" fill="#7FA2FF" text-anchor="start">05</text>
<text x="84" y="508" class="body" font-size="15" fill="#E4EAF1"><tspan font-weight="700">Log it</tspan><tspan fill="#B8C4D1"> · the skill gain goes on record</tspan></text>
</svg>
