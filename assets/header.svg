<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-labelledby="t d">
  <title id="t">L_404 — Skill Ledger</title>
  <desc id="d">ISP support by day, learning to code by hand, ethical hacking in the lab.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(140,170,220,0.05)" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="839" height="199" rx="8"/></clipPath>
    <style>
      .mono { font-family: "JetBrains Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace; }
      .display { font-family: "Segoe UI Black","Segoe UI","Helvetica Neue",Arial,sans-serif; font-weight: 800; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="840" height="200" fill="#10161D"/>
    <rect width="840" height="200" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="199" rx="8" fill="none" stroke="#2A3644"/>

  <!-- left: identity -->
  <text x="40" y="58" class="mono" font-size="12" fill="#93A1B1" letter-spacing="2">SKILL LEDGER · SINCE OCT 2026</text>
  <text x="38" y="116" class="display" font-size="48" fill="#E4EAF1">L_404</text>
  <text x="40" y="152" class="mono" font-size="13" fill="#93A1B1">ISP support by day · learning to code by hand · ethical hacking in the lab</text>

  <!-- language ticks under the name -->
  <rect x="40" y="168" width="18" height="3" rx="1.5" fill="#7FA2FF"/>
  <rect x="62" y="168" width="18" height="3" rx="1.5" fill="#E3B24F"/>

  <!-- right: faint terminal line -->
  <g opacity="0.75">
    <text x="800" y="58" class="mono" font-size="12" fill="#93A1B1" text-anchor="end"><tspan fill="#4CC28A">$</tspan> ./review --project next</text>
    <rect class="cursor" x="806" y="47" width="7" height="13" fill="#4CC28A"/>
  </g>
</svg>
