<text x="44.0" y="132.0" class="mono" font-size="11" fill="#E3B24F" text-anchor="start" letter-spacing="2">CHAPTER 1 · OCT–DEC 2024</text>
<text x="44.0" y="162.0" class="display" font-size="19" fill="#E4EAF1" text-anchor="start">By hand</text>
<text x="44.0" y="190.0" class="body" font-size="15" fill="#B8C4D1" text-anchor="start">Learned Python by writing it myself, using AI only to ask questions. Basics and small games first,</text>
