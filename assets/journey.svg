<text x="36.0" y="38.0" class="mono" font-size="11" fill="#7FA2FF" text-anchor="start" letter-spacing="2" font-weight="600">THE JOURNEY</text>
<text x="24.0" y="82.0" class="display" font-size="31" fill="#E4EAF1" text-anchor="start">Three chapters</text>
